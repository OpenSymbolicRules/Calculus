name: Validate JSON schemas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate rules and test fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install check-jsonschema==0.38.0
      - run: check-jsonschema --check-metaschema Specification/schemas/*.schema.json
      - run: check-jsonschema --schemafile Specification/schemas/meta.schema.json rules/meta.json
      - run: find rules -name '*.json' ! -name meta.json -print0 | xargs -0 check-jsonschema --schemafile Specification/schemas/rule-file.schema.json --base-uri "file://${PWD}/Specification/schemas/"
      - run: python3 Specification/scripts/validate_semantic_closure.py rules
      - run: find tests -name '*.json' -print0 | xargs -0 check-jsonschema --schemafile Specification/schemas/test-file.schema.json --base-uri "file://${PWD}/Specification/schemas/"

  v1:
    name: Check generated OSR v1 files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: OpenSymbolicRules/Verification
          ref: 3971c840be17b91238ba9bc66de5b92bf4e2ddf3
          path: verification
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install check-jsonschema==0.38.0
      - run: scripts/check-v1.sh "verification/reports/$(python3 -c 'import json; print(json.load(open("v1/calculus.report.json"))["build"]["source_digest"].removeprefix("sha256:"))')"
